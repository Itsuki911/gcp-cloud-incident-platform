# Composeプロジェクト名
name: incident-platform

# 起動するコンテナを定義
services:
  # PostgreSQLデータベース
  db:
    # 軽量なPostgreSQLイメージを使用
    image: postgres:17-alpine
    # データベースの初期設定
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    # ホストとコンテナのポートを接続
    ports:
      - "5432:5432"
    # データをボリュームへ保存
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # データベースの起動状態を確認
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 10

  # アプリ起動前にDBスキーマを最新化
  migrate:
    build:
      context: .
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://incident:incident@db:5432/incidents
    depends_on:
      db:
        condition: service_healthy

  # Pub/Subをローカルで再現
  pubsub:
    # 公式Emulatorイメージを使用
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command:
      - gcloud
      - beta
      - emulators
      - pubsub
      - start
      - --project=local-project
      - --host-port=0.0.0.0:8085
    # Emulatorをホストへ公開
    ports:
      - "8085:8085"

  # TopicとPush購読を作成
  pubsub-init:
    build:
      context: .
    command: ["python", "-m", "incident_platform.pubsub_emulator"]
    environment:
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_PROJECT_ID: local-project
      PUBSUB_TOPIC: incident-tickets
      PUBSUB_SUBSCRIPTION: incident-tickets-worker
      PUBSUB_PUSH_ENDPOINT: http://worker:8081/pubsub/tickets
    # EmulatorとWorkerを待つ
    depends_on:
      pubsub:
        condition: service_started
      worker:
        condition: service_healthy

  # Pub/Sub通知を処理
  worker:
    build:
      context: .
    command:
      - uvicorn
      - incident_platform.worker:app
      - --host
      - 0.0.0.0
      - --port
      - "8081"
    environment:
      APP_ENV: local-docker
      DATABASE_URL: postgresql+psycopg://incident:incident@db:5432/incidents
      USE_LOCAL_ANALYZER: "true"
    # Workerをホストへ公開
    ports:
      - "8081:8081"
    # Workerの起動状態を確認
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8081/health')"]
      interval: 5s
      timeout: 5s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully

  # FastAPIアプリケーション
  api:
    # Dockerfileからイメージを作成
    build:
      context: .
    # アプリケーションの環境変数
    environment:
      APP_ENV: local-docker
      DATABASE_URL: postgresql+psycopg://incident:incident@db:5432/incidents
      GOOGLE_CLOUD_PROJECT: local-project
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_TOPIC: incident-tickets
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/google/adc.json
      ATTACHMENT_BUCKET: gcp-cloud-incident-platform-ticket-attachments-888088780947
    # ADCを読み取り専用で共有
    volumes:
      - type: bind
        source: ${APPDATA}/gcloud/application_default_credentials.json
        target: /var/run/google/adc.json
        read_only: true
        bind:
          create_host_path: false
    # APIをホストへ公開
    ports:
      - "8080:8080"
    # データベース起動後にAPIを開始
    depends_on:
      migrate:
        condition: service_completed_successfully
      pubsub-init:
        condition: service_completed_successfully

# コンテナ間で共有する保存領域
volumes:
  postgres-data:
