[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "gcp-cloud-incident-platform"
version = "0.1.0"
description = "Cloud-native AI incident and support triage platform"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi[standard]>=0.115,<1.0",
    "google-cloud-pubsub>=2.31.1,<3.0",
    "google-cloud-secret-manager>=2.20,<3.0",
    "psycopg[binary]>=3.2,<4.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "sqlalchemy>=2.0.51,<2.1",
]

[dependency-groups]
dev = [
    "httpx2>=2.9,<3.0",
    "pytest>=8.3,<9.0",
    "pytest-cov>=6.0,<8.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/incident_platform"]

[tool.pytest.ini_options]
addopts = "-q --cov=incident_platform --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
