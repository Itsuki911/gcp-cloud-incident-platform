# Composeプロジェクト名
name: incident-platform

# 起動するコンテナを定義
services:
  # PostgreSQLデータベース
  db:
    # 軽量なPostgreSQLイメージを使用
    image: postgres:17-alpine
    # データベースの初期設定
    environment:
      POSTGRES_DB: incidents
      POSTGRES_USER: incident
      POSTGRES_PASSWORD: incident
    # ホストとコンテナのポートを接続
    ports:
      - "5432:5432"
    # データをボリュームへ保存
    volumes:
      - postgres-data:/var/lib/postgresql/data
    # データベースの起動状態を確認
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incident -d incidents"]
      interval: 5s
      timeout: 5s
      retries: 10

  # FastAPIアプリケーション
  api:
    # Dockerfileからイメージを作成
    build:
      context: .
    # アプリケーションの環境変数
    environment:
      APP_ENV: local-docker
      DATABASE_URL: postgresql+psycopg://incident:incident@db:5432/incidents
    # APIをホストへ公開
    ports:
      - "8080:8080"
    # データベース起動後にAPIを開始
    depends_on:
      db:
        condition: service_healthy

# コンテナ間で共有する保存領域
volumes:
  postgres-data:
